services:
  mcp:
    build: .
    stdin_open: true
    tty: false
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    environment:
      WORKSPACE_DIR: workspace
      MAX_RENDER_SECONDS: ${MAX_RENDER_SECONDS:-300}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-536870912}
      EXEC_TIMEOUT_MS: ${EXEC_TIMEOUT_MS:-180000}
      MAX_COMPOSITION_SHOTS: ${MAX_COMPOSITION_SHOTS:-32}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
    volumes:
      - type: volume
        source: media
        target: /app/workspace
volumes:
  media:
