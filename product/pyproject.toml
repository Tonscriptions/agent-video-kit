[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ad-editor"
version = "0.1.0"
description = "Local-only Agent-first video editing CLI built on Python and FFmpeg"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-ad-editor = "ai_ad_editor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_ad_editor = ["OPENFILM_LICENSE.txt", "openfilm_subtitle_segments.mjs", "subtitle_segment_worker.mjs"]
